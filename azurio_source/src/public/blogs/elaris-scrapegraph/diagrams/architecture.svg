<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-label="ElarisLabs ScrapeGraph architecture diagram">
        <defs>
          <linearGradient id="gE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7D6CEB"/><stop offset="1" stop-color="#5040C0"/></linearGradient>
          <linearGradient id="gS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#AC6DFF"/><stop offset="1" stop-color="#7A45D9"/></linearGradient>
          <linearGradient id="gCore" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D5AE6"/><stop offset="1" stop-color="#AC6DFF"/></linearGradient>
        </defs>

        <!-- connectors (base + animated flow) -->
        <!-- left column path -->
        <path d="M180 120 L180 168" stroke="#E0DAF7" stroke-width="2.5" fill="none"/>
        <path d="M180 120 L180 168" stroke="#6D5AE6" stroke-width="2.5" fill="none" class="flowdash"/>
        <path d="M180 232 C180 300 300 300 380 330" stroke="#E0DAF7" stroke-width="2.5" fill="none"/>
        <path d="M180 232 C180 300 300 300 380 330" stroke="#6D5AE6" stroke-width="2.5" fill="none" class="flowdash"/>
        <!-- right column path -->
        <path d="M820 120 L820 168" stroke="#CDEDE7" stroke-width="2.5" fill="none"/>
        <path d="M820 120 L820 168" stroke="#AC6DFF" stroke-width="2.5" fill="none" class="flowdash"/>
        <path d="M820 232 C820 300 700 300 620 330" stroke="#CDEDE7" stroke-width="2.5" fill="none"/>
        <path d="M820 232 C820 300 700 300 620 330" stroke="#AC6DFF" stroke-width="2.5" fill="none" class="flowdash"/>
        <!-- client to core -->
        <path d="M500 372 L500 410" stroke="#D7D2E4" stroke-width="2.5" fill="none"/>
        <path d="M500 372 L500 410" stroke="url(#gCore)" stroke-width="2.5" fill="none" class="flowdash"/>
        <!-- core to outputs -->
        <path d="M430 510 C380 580 280 560 200 580" stroke="#E0DAF7" stroke-width="2.5" fill="none"/>
        <path d="M430 510 C380 580 280 560 200 580" stroke="#6D5AE6" stroke-width="2.5" fill="none" class="flowdash"/>
        <path d="M570 510 C620 580 720 560 800 580" stroke="#CDEDE7" stroke-width="2.5" fill="none"/>
        <path d="M570 510 C620 580 720 560 800 580" stroke="#AC6DFF" stroke-width="2.5" fill="none" class="flowdash"/>

        <!-- path labels -->
        <text x="250" y="300" font-family="IBM Plex Mono" font-size="13" fill="#5040C0" font-weight="600">scrape()</text>
        <text x="700" y="300" font-family="IBM Plex Mono" font-size="13" fill="#7A45D9" font-weight="600" text-anchor="end">extract()</text>

        <!-- LEFT NODES -->
        <g class="nodeG">
          <rect x="60" y="64" width="240" height="56" rx="13" fill="#FBFAFE" stroke="#E0DAF7" stroke-width="1.5"/>
          <text x="180" y="89" text-anchor="middle" font-family="Hanken Grotesk" font-weight="600" font-size="14" fill="#16151D">Onboarding page</text>
          <text x="180" y="107" text-anchor="middle" font-family="IBM Plex Mono" font-size="10.5" fill="#7A7686">paste website URL</text>

          <rect x="60" y="176" width="240" height="56" rx="13" fill="#FBFAFE" stroke="#E0DAF7" stroke-width="1.5"/>
          <text x="180" y="201" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="12.5" fill="#5040C0">scrapeBrandData()</text>
          <text x="180" y="219" text-anchor="middle" font-family="IBM Plex Mono" font-size="10.5" fill="#7A7686">+ /api/scrape-brand</text>
        </g>

        <!-- RIGHT NODES -->
        <g class="nodeG">
          <rect x="700" y="64" width="240" height="56" rx="13" fill="#F8FDFC" stroke="#CDEDE7" stroke-width="1.5"/>
          <text x="820" y="89" text-anchor="middle" font-family="Hanken Grotesk" font-weight="600" font-size="14" fill="#16151D">UrlInput component</text>
          <text x="820" y="107" text-anchor="middle" font-family="IBM Plex Mono" font-size="10.5" fill="#7A7686">paste product URL</text>

          <rect x="700" y="176" width="240" height="56" rx="13" fill="#F8FDFC" stroke="#CDEDE7" stroke-width="1.5"/>
          <text x="820" y="201" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="12" fill="#7A45D9">POST /api/product/scrape</text>
          <text x="820" y="219" text-anchor="middle" font-family="IBM Plex Mono" font-size="10.5" fill="#7A7686">shared w/ Product Staging</text>
        </g>

        <!-- SHARED CLIENT -->
        <rect x="350" y="316" width="300" height="56" rx="13" fill="#fff" stroke="#D7D2E4" stroke-width="1.5"/>
        <text x="500" y="341" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="13" fill="#16151D">getSgaiClient()</text>
        <text x="500" y="359" text-anchor="middle" font-family="IBM Plex Mono" font-size="10.5" fill="#7A7686">lazy singleton · scrapegraph-js v2</text>

        <!-- CORE -->
        <ellipse class="core-glow" cx="500" cy="463" rx="150" ry="74" fill="url(#gCore)"/>
        <rect x="370" y="412" width="260" height="100" rx="20" fill="url(#gCore)"/>
        <text x="500" y="455" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="22" fill="#fff">ScrapeGraph API</text>
        <text x="500" y="481" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="rgba(255,255,255,.85)">the intelligence layer</text>

        <!-- OUTPUTS -->
        <rect x="60" y="556" width="270" height="58" rx="13" fill="#FBFAFE" stroke="#E0DAF7" stroke-width="1.5"/>
        <text x="195" y="581" text-anchor="middle" font-family="Hanken Grotesk" font-weight="600" font-size="13" fill="#16151D">saveBrandData() → Supabase</text>
        <text x="195" y="599" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#7A7686">→ Studio · Scheduler · Insights</text>

        <rect x="670" y="556" width="270" height="58" rx="13" fill="#F8FDFC" stroke="#CDEDE7" stroke-width="1.5"/>
        <text x="805" y="581" text-anchor="middle" font-family="Hanken Grotesk" font-weight="600" font-size="13" fill="#16151D">UrlVideoWizard</text>
        <text x="805" y="599" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#7A7686">→ script → voiceover → render</text>
      </svg>